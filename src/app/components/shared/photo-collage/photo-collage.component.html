<div #collage class="photo-collage" aria-hidden="true">
  @for (image of images; track $index) {
    <img class="photo-source" [src]="image" alt="" />
  }
  @if (mosaic) {
    <div class="mosaic-root" [style.width.px]="mosaicWidth" [style.height.px]="mosaicHeight">
      @for (tile of tiles; track tile.src) {
        <img
          class="mosaic-photo"
          [src]="tile.src"
          alt=""
          [style.left.%]="tile.x"
          [style.top.%]="tile.y"
          [style.width.%]="tile.width"
          [style.height.%]="tile.height"
        />
      }
    </div>
  }
</div>
