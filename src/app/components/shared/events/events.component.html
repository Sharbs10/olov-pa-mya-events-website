<app-header></app-header>
<main class="events-page">
  <header class="events-heading">
    <h1>Events</h1>
    <p>Discover what's happening in our community.</p>
  </header>
  <section class="events-showcase" aria-label="Featured event posters">
    @if (pImages.length > 0) {
      <button
        class="events-control events-previous"
        type="button"
        aria-label="Show previous event poster"
        (click)="showPreviousPoster()"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <img
        [src]="pImages[pCurrentIndex]"
        [alt]="'Featured event poster ' + (pCurrentIndex + 1) + ' of ' + pImages.length"
        class="event-poster"
        (mouseenter)="pausePSlideshow()"
        (mouseleave)="resumePSlideshow()"
      />
      <button
        class="events-control events-next"
        type="button"
        aria-label="Show next event poster"
        (click)="showNextPoster()"
      >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    }
  </section>
  <div class="events-pagination" aria-live="polite">
    <span>Featured events</span>
    @if (pImages.length > 0) {
      <span>{{ pCurrentIndex + 1 }} / {{ pImages.length }}</span>
    }
  </div>
</main>
<app-footer></app-footer>
