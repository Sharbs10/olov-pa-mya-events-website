<div class="grid-container">
  <section class="left-sidebar">
    <nav>
      <ul>
        <li><a routerLink="/">Home</a></li>
        <li><a routerLink="/events">Events</a></li>
        <li><a routerLink="/calendar">Calendar</a></li>
        <li><a routerLink="/board">Board</a></li>
      </ul>
    </nav>
  </section>
  <main class="main-content">
    <div class="background-slideshow" *ngIf="images.length > 0">
      <img 
        *ngFor="let image of images; let i = index"
        [src]="image"
        [class.active]="i === currentIndex"
        alt="Background image {{ i + 1 }}"
      />
      <!-- <img [src]="images[currentIndex]" alt="Slideshow Image" /> -->
    </div>
    <div class="image-container">
      <img src="assets/images/tCross.png" alt="Transparent Image" class="transparent-image">
      <div class="slideshow">
        <img 
        *ngIf="pImages.length > 0"
        [src]="pImages[pCurrentIndex]"
        alt="Event Poster"
        class="event-poster"
        (click)="goToEvents()"
      />
      </div>
    </div> 
  </main>
</div>
