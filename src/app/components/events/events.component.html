<header class="home-header" routerLink="/">
  Our Lay of Victory MYA Pitt Events
</header>

<main class="main-content">
  <div class="eImage-container">
    <div class="eSlideshow">
      <img
        *ngIf="pImages.length > 0"
        [src]="pImages[pCurrentIndex]"
        alt="Event Poster"
        class="eEvent-poster"
        (mouseenter)="pausePSlideshow()"
        (mouseleave)="resumePSlideshow()"
      />
    </div>
  </div>
</main>
