<div class="grid-container">
    <section class="left-sidebar">
        <nav>
          <ul>
            <li><a routerLink="/">Home</a></li>
            <li><a routerLink="/events">Events</a></li>
            <li><a routerLink="/calendar">Calendar</a></li>
            <li><a routerLink="/board">Board</a></li>
          </ul>
        </nav>
      </section>
    <main class="main-content">
        <div class="calendar">
            <h1>Event Calendar</h1>           
            <div class="calendar-header">
              <button (click)="prevMonth()">← Previous</button>
              <h2>{{ currentMonth + 1 | number: '2.0' }} / {{ currentYear }}</h2>
              <button (click)="nextMonth()">Next →</button>
            </div>
          
            <div class="calendar-grid">
              <div *ngFor="let day of daysInMonth" class="calendar-day">
                <span>{{ day }}</span>
          
                <!-- Show event name -->
                <div *ngFor="let event of getEvents(day)" class="event" [title]="event.description">
                    {{ event.name }}
                  </div>
              </div>
            </div>
          </div>
    </main>
</div>
