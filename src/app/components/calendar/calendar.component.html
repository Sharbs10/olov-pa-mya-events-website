<div class="grid-container">
    <section class="left-sidebar">
        <nav>
          <ul>
            <li><a routerLink="/">Home</a></li>
            <li><a routerLink="/events">Events</a></li>
            <li><a routerLink="/calendar">Calendar</a></li>
            <li><a routerLink="/board">Board</a></li>
          </ul>
        </nav>
      </section>
    <main class="main-content">
        <div class="calendar">
            <h1>Event Calendar</h1>
            <div class="calendar-header">                
              <button (click)="goToPreviousMonth()">&#8592; Previous</button>
              <span>{{ month + 1 }} / {{ year }}</span>
              <button (click)="goToNextMonth()">Next &#8594;</button>
            </div>
          
            <div class="calendar-grid">
              <div *ngFor="let day of daysInMonth" class="day">
                <div (click)="onDayClick(day)" class="day-square">
                  <span>{{ day }}</span>
                  <div *ngIf="eventDetails[year + '-' + (month + 1) + '-' + day]">
                    <small>{{ eventDetails[year + '-' + (month + 1) + '-' + day] }}</small>
                  </div>
                </div>
              </div>
            </div>
          
            <!-- <div *ngIf="selectedDate" class="event-editor">
              <h3>Edit Event for {{ selectedDate }}</h3>
              <form [formGroup]="eventForm" (ngSubmit)="saveEvent()">
                <input formControlName="eventTitle" placeholder="Enter event details" />
                <button type="submit">Save Event</button>
              </form>
            </div> -->
          </div>
    </main>
</div>
